server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Behind Dokploy's proxy: keep redirects relative so https is preserved
  absolute_redirect off;
  port_in_redirect off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

  # URLs from the previous Hugo site
  location ~ ^/(about|about-us)/?$ { return 301 /#about; }
  location ~ ^/contact/?$ { return 301 /#contact; }
  location ~ ^/(posts|blog|articles|showcase|docs)/?$ { return 301 /#writing; }

  location ~ ^/(tags|categories)(/.*)?$ { return 301 /#writing; }
  location = /index.xml { return 301 /#writing; }

  # Next exports the Open Graph image without an extension
  location = /opengraph-image { default_type image/png; }

  # add_header inside a location drops the server-level ones, so they are repeated here
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
  }

  # HTML revalidates on every visit so a redeploy never serves stale chunk names
  location / {
    try_files $uri $uri.html $uri/ =404;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
  }

  error_page 404 /404.html;
}
